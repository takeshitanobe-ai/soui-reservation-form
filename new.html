<!doctype html>
<html lang="ja" data-form="new">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sou-i 予約フォーム</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/themes/base/jquery-ui.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.min.css">
  <style>
    body { background: #fff; color: #222; }
    .notice {
      margin: 0 auto 28px;
      padding: 28px 18px;
      max-width: 860px;
      text-align: center;
      font-size: clamp(20px, 4vw, 38px);
      font-weight: 700;
      line-height: 1.45;
      white-space: pre-line;
    }
    .date-notice {
      margin: 28px 0 12px;
      font-size: clamp(18px, 3.8vw, 32px);
      font-weight: 700;
      line-height: 1.45;
      white-space: pre-line;
    }
    .form-wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 56px; }
    label { margin-top: 16px; font-weight: 700; }
    .btn-submit { min-width: 120px; }
    .loading { padding: 32px; text-align: center; color: #555; }
  </style>
</head>
<body>
  <main class="form-wrap">
    <div id="loading" class="loading">フォームを読み込んでいます...</div>
    <section id="formArea" hidden>
      <div id="topNotice" class="notice"></div>
      <form id="reservationForm">
        <label for="name">お名前</label>
        <input class="form-control" id="name" name="name" required>

        <label for="phone">電話番号</label>
        <input class="form-control" id="phone" name="phone" inputmode="tel" required>

        <label for="menu">ご希望メニュー</label>
        <select class="form-control" id="menu" name="menu"></select>

        <label for="stylist">担当者</label>
        <select class="form-control" id="stylist" name="stylist"></select>

        <div id="dateNotice" class="date-notice"></div>

        <label for="schedule1">ご希望日時</label>
        <input class="form-control schedule" id="schedule1" name="schedule1" value="第１希望" readonly>

        <label for="schedule2">ご希望日時</label>
        <input class="form-control schedule" id="schedule2" name="schedule2" value="第２希望" readonly>

        <label for="schedule3">ご希望日時</label>
        <input class="form-control schedule" id="schedule3" name="schedule3" value="第３希望" readonly>

        <label for="remarks" id="remarksLabel">ご希望・ご相談はこちら</label>
        <p id="remarksHelp" class="mb-2"></p>
        <textarea class="form-control" id="remarks" name="remarks" rows="3"></textarea>

        <input type="submit" class="mt-4 btn btn-primary btn-submit" value="送信">
      </form>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.full.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const DEFAULT_FORM_KEY = document.documentElement.dataset.form || "repeat";
    const FORM_KEY = DEFAULT_FORM_KEY; // 2026-09-08 ?form= の上書きを無効化（新規ルールの迂回防止）
    const CONFIG_URL = "form-config.json"; // 2026-09-08 ?config= の上書きを無効化
    const FALLBACK_CONFIG = {
      "forms": {
        "repeat": {
          "title": "Sou-i 予約フォーム",
          "liff_id": "2010458222-O6dZecdq",
          "top_notice": "土日のご予約が大変混み合っております。\n比較的余裕を持ったお問合せをよろしくお願い致します。",
          "date_notice": "受付時間は、平日 10:00〜／土日祝 9:30〜、30分きざみでお選びいただけます。\n最終受付はカット17:30／カラー・パーマ16:00です。定休日（月曜・第2火曜・第3日曜）は選べません。\n混雑具合によっては、ご希望日時にお取り出来ない場合がございます。\n日程をズラす等、できる限り第３希望までのご入力をお願い致します。",
          "remarks_label": "ご希望・ご相談はこちら",
          "remarks_help": "上記のご希望日時以外にもご来店可能な日時があればご記入下さい",
          "thanks_message": "ご入力ありがとうございます。\n日時が確定しましたら、\n担当よりご連絡をさせて頂きます。\n今しばらくお待ちくださいませ。\n\nSou-i hair face＆eye",
          "menus": [
            "カット",
            "カット＋カラー",
            "カット+カラー+トリートメント",
            "カット＋トリートメント",
            "カット＋ヘッドスパ",
            "カット＋カラー＋ヘッドスパ",
            "カット＋パーマ",
            "カット&ストレート",
            "カット+パーマ+トリートメント",
            "カット＋パーマ＋ヘッドスパ",
            "ヘッドスパ",
            "髪質改善トリートメント",
            "ドライヘッドスパ",
            "マツエク",
            "マツパー",
            "フェイシャル"
          ],
          "stylists": [
            "指名なし",
            "飯沼 美里",
            "川田 綾子",
            "菅原 都美",
            "田野辺 武（ご新規対応×）",
            "石井 瑞希",
            "滑澤 由衣",
            "佐藤 真由美",
            "武田 葵",
            "佐野 仁美"
          ]
        },
        "new": {
          "title": "‘24/4からご来店のお客様",
          "liff_id": "2010458222-j4t11ZrN",
          "top_notice": "営業時間は、平日 10:00〜18:30／土日 9:30〜18:30です。\n最終受付はカット17:30／カラー・パーマ16:00です。\n定休日は月曜・第2火曜・第3日曜です。\n\nカットのみをご希望の方は、カット＋頭皮ケアスパコース（男性 ¥8,800／90分・女性 ¥9,500／120分）でのご案内になります。\n\nお子様（中学生以下）の新規ご予約はお受けしていません。高校生以上はご予約いただけます。\n※ロイヤル会員様のお子様はご予約いただけます。",
          "date_notice": "受付時間は、平日 10:00〜／土日祝 9:30〜、30分きざみでお選びいただけます。\n最終受付はカット17:30／カラー・パーマ16:00です。定休日（月曜・第2火曜・第3日曜）は選べません。\nできる限り第３希望までのご入力をお願い致します。",
          "remarks_label": "ご希望・ご相談はこちら",
          "remarks_help": "上記のご希望日時以外にもご来店可能な日時があればご記入下さい。",
          "thanks_message": "ご入力ありがとうございます。\n日時が確定しましたら、\n担当よりご連絡をさせて頂きます。\n今しばらくお待ちくださいませ。\n\nSou-i hair face＆eye",
          "menus": [
            "カット＋頭皮ケアスパコース",
            "カット＋カラー",
            "カット+カラー+トリートメント",
            "カット＋トリートメント",
            "カット＋ヘッドスパ",
            "カット＋カラー＋ヘッドスパ",
            "カット＋パーマ",
            "カット&ストレート",
            "カット+パーマ+トリートメント",
            "カット＋パーマ＋ヘッドスパ",
            "ヘッドスパ",
            "髪質改善トリートメント",
            "ドライヘッドスパ",
            "マツエク",
            "マツパー",
            "フェイシャル"
          ],
          "stylists": [
            "指名なし",
            "飯沼 美里",
            "川田 綾子",
            "菅原 都美",
            "石井 瑞希",
            "滑澤 由衣",
            "佐藤 真由美",
            "武田 葵",
            "佐野 仁美"
          ]
        }
      },
      "hours": {
        "weekday_open": "10:00",
        "weekend_holiday_open": "09:30",
        "last_reception_default": "17:30",
        "last_reception_color_perm": "16:00",
        "color_perm_pattern": "カラー|パーマ|ストレート",
        "step_minutes": 30,
        "closed_weekdays": [
          1
        ],
        "closed_nth": [
          {
            "weekday": 2,
            "n": 2
          },
          {
            "weekday": 0,
            "n": 3
          }
        ],
        "holidays": [
          "2026-09-21",
          "2026-09-22",
          "2026-09-23",
          "2026-10-12",
          "2026-11-03",
          "2026-11-23",
          "2027-01-01",
          "2027-01-11",
          "2027-02-11",
          "2027-02-23",
          "2027-03-21",
          "2027-04-29",
          "2027-05-03",
          "2027-05-04",
          "2027-05-05",
          "2027-07-19",
          "2027-08-11",
          "2027-09-20",
          "2027-09-23",
          "2027-10-11",
          "2027-11-03",
          "2027-11-23"
        ],
        "holidays_note": "祝日は毎年12月に翌年分を足す（土日祝は9:30開店）。年末年始の休みは店の決定後に holidays へ追加"
      }
    }; // 2026-09-08 本番 form-config.json と同一（取得失敗時も同じ案内にする・hours を含む）

    // 2026-09-08 受付時間（平日10:00〜／土日祝9:30〜・30分きざみ・最終受付はメニュー別・定休日は選べない）
    function resolveHours(config) {
      return config && config.hours ? config.hours : FALLBACK_CONFIG.hours;
    }
    function pad2(n) { return String(n).padStart(2, "0"); }
    function dateKey(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
    function nthWeekdayOfMonth(d) { return Math.floor((d.getDate() - 1) / 7) + 1; }
    function isHoliday(hours, d) { return (hours.holidays || []).includes(dateKey(d)); }
    function isClosedDay(hours, d) {
      if ((hours.closed_weekdays || []).includes(d.getDay())) return true;
      return (hours.closed_nth || []).some((r) => r.weekday === d.getDay() && r.n === nthWeekdayOfMonth(d));
    }
    function opensEarly(hours, d) { return d.getDay() === 0 || d.getDay() === 6 || isHoliday(hours, d); }
    function lastReception(hours, menu) {
      const pattern = new RegExp(hours.color_perm_pattern || "カラー|パーマ|ストレート");
      return pattern.test(menu || "") ? hours.last_reception_color_perm : hours.last_reception_default;
    }
    function formatDateTime(d) {
      return d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }
    function allowedTimes(hours, d, menu) {
      const toMin = (t) => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };
      const start = toMin(opensEarly(hours, d) ? hours.weekend_holiday_open : hours.weekday_open);
      const end = toMin(lastReception(hours, menu));
      const step = hours.step_minutes || 30;
      const out = [];
      for (let m = start; m <= end; m += step) out.push(pad2(Math.floor(m / 60)) + ":" + pad2(m % 60));
      return out;
    }

    function asList(value) {
      return Array.isArray(value) ? value : [];
    }

    function setOptions(select, values) {
      select.innerHTML = "";
      values.forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    async function loadConfig() {
      try {
        const response = await fetch(CONFIG_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("設定ファイルを読み込めませんでした");
        return await response.json();
      } catch (error) {
        console.warn("設定ファイルの読み込みに失敗したため、予備設定で表示します。", error);
        return FALLBACK_CONFIG;
      }
    }

    async function initLiff(liffId) {
      if (!liffId || !window.liff) return false;
      try {
        await liff.init({ liffId });
        return true;
      } catch (error) {
        console.warn("LIFF init failed", error);
        return false;
      }
    }

    function sendText(text, liffReady) {
      if (!liffReady) {
        alert("LINE内で開くと送信できます。\n\n確認用メッセージ:\n" + text);
        return;
      }
      liff.sendMessages([{ type: "text", text }])
        .then(() => liff.closeWindow())
        .catch((error) => alert("送信できませんでした: " + error));
    }

    function buildMessage(form, cfg) {
      const name = form.name.value;
      const phone = form.phone.value;
      const menu = form.menu.value;
      const stylist = form.stylist.value;
      const schedule1 = form.schedule1.value;
      const schedule2 = form.schedule2.value;
      const schedule3 = form.schedule3.value;
      const remarks = form.remarks.value;
      return `${name} 様\n${phone}\n${menu}\n${stylist}\n${schedule1}\n${schedule2}\n${schedule3}\n${remarks}\n\n${cfg.thanks_message || ""}`;
    }

    async function main() {
      const config = await loadConfig();
      // 2026-09-08 取得したJSONに自分のフォーム（FORM_KEY）が無い時は、別フォーム（repeat）へ流さず自分の予備設定を使う
      const fallbackForm = FALLBACK_CONFIG.forms[FORM_KEY];
      const cfg = config && config.forms && config.forms[FORM_KEY] ? config.forms[FORM_KEY] : fallbackForm;
      document.title = cfg.title || "Sou-i 予約フォーム";
      document.getElementById("topNotice").textContent = cfg.top_notice || "";
      document.getElementById("dateNotice").textContent = cfg.date_notice || "";
      document.getElementById("remarksLabel").textContent = cfg.remarks_label || "ご希望・ご相談はこちら";
      document.getElementById("remarksHelp").textContent = cfg.remarks_help || "";
      setOptions(document.getElementById("menu"), asList(cfg.menus));
      setOptions(document.getElementById("stylist"), asList(cfg.stylists));
      const hours = resolveHours(config);
      const menuSelect = document.getElementById("menu");
      $(".schedule").datetimepicker({
        lang: "ja",
        format: "Y/m/d H:i",
        step: hours.step_minutes || 30,
        minDate: 0,
        scrollTime: false,
        validateOnBlur: false,
        beforeShowDay: (date) => [!isClosedDay(hours, date), ""],
        // onGenerate は再描画のたびに古い日付で上書きするので使わない（2026-09-08 ライブ検証）
        onShow: function (currentTime) {
          this.setOptions({ allowTimes: allowedTimes(hours, currentTime || new Date(), menuSelect.value) });
        },
        onSelectDate: function (currentTime) {
          const picker = this;
          const times = allowedTimes(hours, currentTime, menuSelect.value);
          picker.setOptions({ allowTimes: times });
          // 日付だけ選んで時間を押していない場合、その日の最初の枠に寄せる（例：10:59 → 平日10:00／土日祝9:30）
          // プラグインが日付クリック後に値を書き戻すので、その後（setTimeout 0）に上書きする
          const hm = pad2(currentTime.getHours()) + ":" + pad2(currentTime.getMinutes());
          if (!times.includes(hm)) {
            const [h, m] = times[0].split(":").map(Number);
            const snapped = new Date(currentTime.getTime());
            snapped.setHours(h, m, 0, 0);
            setTimeout(function () {
              picker.data("xdsoft_datetime").setCurrentTime(snapped);
              $(".schedule").each(function () {
                const owner = $(this).data("xdsoft_datetimepicker");
                if (owner && owner[0] === picker[0]) {
                  $(this).val(formatDateTime(snapped));
                }
              });
            }, 0);
          }
        },
        onChangeDateTime: function (currentTime) {
          this.setOptions({ allowTimes: allowedTimes(hours, currentTime || new Date(), menuSelect.value) });
        }
      });
      const liffReady = await initLiff(cfg.liff_id);
      document.getElementById("reservationForm").addEventListener("submit", (event) => {
        event.preventDefault();
        sendText(buildMessage(event.currentTarget, cfg), liffReady);
      });
      document.getElementById("loading").hidden = true;
      document.getElementById("formArea").hidden = false;
    }

    main().catch((error) => {
      document.getElementById("loading").textContent = "フォーム設定の読み込みに失敗しました: " + error.message;
    });
  </script>
</body>
</html>
